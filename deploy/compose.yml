name: t1-management
services:
  mysql:
    image: mysql:8.0.45
    restart: unless-stopped
    mem_limit: 640m
    cpus: 0.75
    environment:
      MYSQL_DATABASE: t1_fitness
      MYSQL_USER: t1_app
      MYSQL_PASSWORD_FILE: /run/secrets/database_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/database_root_password
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--innodb-buffer-pool-size=134217728", "--max-connections=40", "--performance-schema=OFF", "--mysqlx=0"]
    volumes:
      - /var/lib/t1-management/mysql:/var/lib/mysql
      - /etc/t1-management/secrets/database_password:/run/secrets/database_password:ro
      - /etc/t1-management/secrets/database_root_password:/run/secrets/database_root_password:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$(cat /run/secrets/database_root_password)\" mysql -h127.0.0.1 -uroot -N -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [private]
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  redis:
    image: redis:7.4.8-alpine
    restart: unless-stopped
    user: "10001:10001"
    mem_limit: 128m
    cpus: 0.25
    command: ["redis-server", "/etc/redis/redis.conf"]
    volumes:
      - /var/lib/t1-management/redis:/data
      - /etc/t1-management/redis.conf:/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(sed -n 's/^requirepass //p' /etc/redis/redis.conf)\" redis-cli --no-auth-warning ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]
    logging: *logging
  api:
    image: eclipse-temurin:21-jre-jammy
    restart: unless-stopped
    user: "10001:10001"
    working_dir: /app
    mem_limit: 768m
    cpus: 1.0
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: production
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx448m -XX:MaxDirectMemorySize=96m -XX:MaxMetaspaceSize=160m -XX:ActiveProcessorCount=2 -Duser.timezone=Asia/Shanghai"
    env_file: /etc/t1-management/production.env
    command: ["java", "-jar", "/app/app.jar", "--spring.config.additional-location=file:/app/config/"]
    volumes:
      - ./app.jar:/app/app.jar:ro
      - ./application-production.yml:/app/config/application-production.yml:ro
      - /var/lib/t1-management/media:/app/media
      - /var/lib/t1-management/logs:/app/logs
      - /var/lib/t1-management/temp:/app/temp
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [private]
    logging: *logging
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    ports: ["172.19.0.1:18868:8080"]
    volumes:
      - ./web.conf:/etc/nginx/conf.d/default.conf:ro
      - ./admin:/usr/share/nginx/html:ro
      - ./h5:/usr/share/nginx/h5:ro
    depends_on: [api]
    networks: [private]
    logging: *logging
networks:
  private:
    name: t1-management-private
