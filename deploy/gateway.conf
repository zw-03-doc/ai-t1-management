# Loaded by the existing gateway through its persistent template include.
limit_req_zone $binary_remote_addr zone=t1_api:1m rate=20r/s;
server {
    listen 80;
    server_name t1.wedodiary.top;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / { return 308 https://t1.wedodiary.top$request_uri; }
}
server {
    listen 443 ssl;
    server_name t1.wedodiary.top;
    ssl_certificate /etc/nginx/tls/t1/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/t1/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 35m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /healthz { return 404; }
    location / {
        limit_req zone=t1_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://172.19.0.1:18868;
        proxy_http_version 1.1;
        proxy_set_header Host t1.wedodiary.top;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 100s;
        proxy_buffering off;
    }
}
